services:
  db:
    image: postgres:18
    environment:
      POSTGRES_DB: rotationtracker
      POSTGRES_USER: rotationtracker
      POSTGRES_PASSWORD: local-dev-only
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - db-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U rotationtracker -d rotationtracker"]
      interval: 5s
      retries: 10

  app:
    build: .
    ports:
      - "${APP_PORT:-8080}:8080"
    environment:
      ConnectionStrings__Default: Host=db;Database=rotationtracker;Username=rotationtracker;Password=local-dev-only
    depends_on:
      db:
        condition: service_healthy

volumes:
  db-data:
